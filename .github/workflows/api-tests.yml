name: API Tests

on:
  push:
    branches: [ main, master, cinema ]
  pull_request:
    branches: [ main, master, cinema ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: |
          docker compose --version
      
      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build
          echo "Waiting for services to be ready..."
          for i in $(seq 1 60); do
            ok=0
            curl -fsS http://127.0.0.1:8080/health >/dev/null && ok=$((ok+1)) || true
            curl -fsS http://127.0.0.1:8081/api/movies/health >/dev/null && ok=$((ok+1)) || true
            curl -fsS http://127.0.0.1:8082/api/events/health >/dev/null && ok=$((ok+1)) || true
            curl -fsS http://127.0.0.1:8000/health >/dev/null && ok=$((ok+1)) || true
            if [ "$ok" -eq 4 ]; then
              echo "All services are ready"
              exit 0
            fi
            echo "ready ${ok}/4, attempt ${i}"
            sleep 5
          done
          docker compose ps
          docker compose logs --tail 80
          exit 1
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json
      
      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: npm install
      
      - name: Run API tests
        working-directory: tests/postman
        run: |
          mkdir -p reports
          docker build -t cinemaabyss-api-tests .
          docker run --network=cinemaabyss-network -v "$(pwd)/reports:/app/reports" cinemaabyss-api-tests
        
      
      - name: Stop services
        if: always()
        run: docker compose down